  <!-- Pipeline Nodes -->
  <path d="M244 230 H304" stroke="#0071E3" stroke-width="2"/>
  <path d="M496 230 H556" stroke="#0071E3" stroke-width="2"/>
  <path d="M400 300 V380" stroke="#1D1D1F" stroke-width="1.5"/>

  <!-- Node 1 -->
  <rect x="64" y="160" width="180" height="140" rx="14" fill="#FAFAFC" stroke="#D6D6D6" stroke-width="1.2"/>
  <text x="84" y="194" fill="#86868B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">STEP 01 · TRIGGER</text>
  <text x="84" y="224" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600">Document Intake</text>
  <text x="84" y="250" fill="#707070" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Structured schema parsing</text>
  <text x="84" y="278" fill="#1D1D1F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">12 ms avg</text>

  <!-- Node 2 -->
  <rect x="304" y="152" width="192" height="156" rx="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.8"/>
  <text x="324" y="188" fill="#0066CC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">STEP 02 · VALIDATE</text>
  <text x="324" y="218" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600">Policy &amp; Risk Engine</text>
  <text x="324" y="244" fill="#707070" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Deterministic rule evaluation</text>
  <text x="324" y="280" fill="#0066CC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Confidence &gt;= 0.99</text>

  <!-- Node 3 -->
  <rect x="556" y="160" width="180" height="140" rx="14" fill="#FAFAFC" stroke="#D6D6D6" stroke-width="1.2"/>
  <text x="576" y="194" fill="#86868B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">STEP 03 · COMMIT</text>
  <text x="576" y="224" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600">ERP Ledger Sync</text>
  <text x="576" y="250" fill="#707070" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Idempotent transaction log</text>
  <text x="576" y="278" fill="#1D1D1F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Verified Write</text>

  <!-- Bottom Summary Panel -->
  <rect x="64" y="380" width="672" height="148" rx="14" fill="#FAFAFC" stroke="#E6E6E8"/>
  <text x="96" y="422" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">WORKFLOW EXECUTION SUMMARY</text>
  <text x="96" y="468" fill="#1D1D1F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="600">74%</text>
  <text x="96" y="494" fill="#707070" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Reduction in Manual Triage Time</text>

  <line x1="320" y1="412" x2="320" y2="500" stroke="#E6E6E8"/>
  <text x="356" y="468" fill="#1D1D1F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="600">100%</text>
  <text x="356" y="494" fill="#707070" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Cryptographic Audit Trail Coverage</text>

  <line x1="560" y1="412" x2="560" y2="500" stroke="#E6E6E8"/>
  <text x="592" y="468" fill="#0071E3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="600">0</text>
  <text x="592" y="494" fill="#707070" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Unverified State Mutations</text>
