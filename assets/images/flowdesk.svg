<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="Flowdesk concept interface showing deterministic multi-step workflow automation pipeline">
  <rect width="800" height="600" rx="20" fill="#F5F5F7"/>
  <rect x="32" y="32" width="736" height="536" rx="16" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1.2"/>
  <line x1="32" y1="88" x2="768" y2="88" stroke="#E6E6E8" stroke-width="1"/>
  <text x="64" y="66" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">Flowdesk · Autonomous Operations &amp; Human-in-the-Loop Routing</text>
