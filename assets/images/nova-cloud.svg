<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="Nova Cloud concept architecture showing multi-region Kubernetes topology and automated failover">
  <rect width="800" height="600" rx="20" fill="#F5F5F7"/>
